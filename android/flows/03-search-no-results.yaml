appId: org.wikipedia
tags:
  - regression
  - negative
---
# TC-03. Search with no results (negative)
# A meaningless query -> an empty-state message; the Clear button resets the search
# and the query is kept in Recent searches.

- runFlow: ../subflows/clean-start.yaml
- runFlow: ../subflows/open-search.yaml

- inputText: "blahblahchanandolerbong"

# Wait until the search finishes and the empty-state message appears.
# Depending on the app version it says "No results" or "No results found".
- extendedWaitUntil:
    visible: "No results.*"
    timeout: 15000

# The query is still in the search field (the app did not reset it)
- assertVisible:
    id: ".*search_src_text"
    text: "blahblahchanandolerbong"

# Clear the query with the X button
- tapOn:
    id: ".*search_close_btn"

# The field is empty and the empty-state message is gone
- assertNotVisible:
    id: ".*search_src_text"
    text: "blahblahchanandolerbong"
- assertNotVisible: "No results.*"

# The app keeps the query in Recent searches, even one without results
- assertVisible: "Recent searches:"
- assertVisible: "blahblahchanandolerbong"
